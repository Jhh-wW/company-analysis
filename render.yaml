services:
  - type: web
    # GitHub 저장소 이름은 company-analysis(2026-09-01 이전). Render 서비스
    # 이름은 그대로 둔다 — 바꾸면 기존 URL이 바뀐다.
    name: company-analysis-beta
    runtime: docker
    # 실제 DART 118,747사 후보 색인이 512MiB를 넘어 Starter에서 재시작됐다.
    # 실분석 운영에 필요한 최소 사양인 Standard(2GiB)를 사용한다.
    plan: standard
    region: singapore
    numInstances: 1
    dockerfilePath: ./app/Dockerfile
    dockerContext: .
    healthCheckPath: /readyz
    # ⛔ maxShutdownDelaySeconds 를 «여기 넣지 마라» (2026-08-29 실측).
    #   Render 가 Blueprint 동기화를 거부한다:
    #     services[0].maxShutdownDelaySeconds
    #     max shutdown delay is not supported for services with a disk
    #   아래 disk: 와 함께 쓸 수 없다. 디스크는 SQLite·보고서·감사 기록을
    #   보존하므로 뺄 수 없다 — 그래서 이쪽을 뺀다.
    # ⚠️ 결과: 종료 유예는 Render 기본값(30초)이다. 그런데 앱은
    #   HTTP 정리 20초 + 조사 drain 240초 + 취소 1초 를 «직렬»로 기대한다.
    #   즉 배포·재시작 중이던 조사는 정리를 끝내기 전에 잘릴 수 있다.
    #   이건 v2-98 이 만든 문제가 아니라 master 배포본이 내내 있던 상태다.
    #   근본 해결은 docs/architecture/deployment-contract.md 의 종료·교체 순서에 있다.
    # 첫 관리자 베타는 비용과 외부 변경을 통제하도록 수동 배포만 허용한다.
    autoDeployTrigger: off

    # SQLite·보고서·감사 기록을 재배포와 재시작 뒤에도 보존한다.
    disk:
      name: company-analysis-data
      mountPath: /var/data
      sizeGB: 1

    envVars:
      # 실제 provider를 쓰되, 품질 검증이 끝날 때까지 관리자 한 명으로 범위를 고정한다.
      - key: PIPELINE
        value: real
      - key: BETA_ADMIN_ONLY
        value: "1"

      # 보고서 본문을 composer(엔진 v2)가 쓴다. 코드는 이 값이 정확히 "1"일
      # 때만 갈리므로(app/src/features/pipeline/real.py) 따옴표를 지운 1이나
      # true로 바꾸면 오류 없이 조용히 v1로 되돌아간다.
      # v2는 전용 1층 캐시를 쓴다. 배포·생성기·사업연도·실제 DART 공시/재무
      # 지문 중 하나라도 달라지면 옛 결과를 쓰지 않고, 모두 같을 때만 재사용한다.
      - key: ENGINE_V2
        value: "1"

      # 새 엄격 계약은 실제 모델 표본 검증 전에는 사용자 출고를 바꾸지 않는다.
      # 코드가 이 값의 누락을 fail-closed로 막으므로 Blueprint에도 반드시
      # 명시한다. 제한 실측을 통과하기 전 FULL로 올리지 않는다.
      - key: REPORT_RELEASE_MODE
        value: SHADOW

      # Render edge가 붙인 forwarded header는 전혀 신뢰하지 않는다. 앱은 고정된
      # 공개 HTTPS origin만 Host·CSRF·HSTS 판단에 사용한다.
      - key: DEPLOYMENT_EXPOSURE
        value: public
      - key: DEPLOYMENT_PLATFORM
        value: render
      - key: DEPLOYMENT_RUNTIME_CONTRACT
        value: render-admin-real-no-forwarded-v1
      - key: PUBLIC_ORIGIN
        fromService:
          type: web
          name: company-analysis-beta
          envVarKey: RENDER_EXTERNAL_URL
      - key: FORWARDED_ALLOW_IPS
        value: ""
      - key: GRACEFUL_SHUTDOWN_SECONDS
        value: "20"

      # 위 영속 디스크 안에 운영 데이터와 캐시를 모은다.
      - key: APP_DATA_ROOT
        value: /var/data
      # 1GB 디스크의 절반만 최초 승인 PDF 원본에 배정한다. 나머지는 SQLite·
      # 감사 기록·캐시의 여유다. 한도를 넘으면 과거 원본을 지우지 않고 새 출고를 막는다.
      - key: REPORT_ARTIFACT_CAPACITY_BYTES
        value: "536870912"
      - key: STORAGE_DB_PATH
        value: /var/data/storage.db
      - key: OBSERVABILITY_RECORDS_PATH
        value: /var/data/observability/runs.jsonl
      - key: TLDEXTRACT_CACHE
        value: /var/data/cache/tldextract

      # 비밀값은 저장소가 아니라 Blueprint 생성 화면에서 사용자가 직접 입력한다.
      - key: ADMIN_EMAILS
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false

      # 실제 분석 provider 값은 저장소에 넣지 않고 Render 비밀 환경변수로만 주입한다.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DART_API_KEY
        sync: false
      - key: NAVER_CLIENT_ID
        sync: false
      - key: NAVER_CLIENT_SECRET
        sync: false

      # 실행 기록을 재시작 뒤에도 검증할 수 있도록 Render가 고정 비밀을 만든다.
      - key: PROVENANCE_SEAL_SECRET
        generateValue: true

# 외부 백업 cron과 BACKUP_* 값은 의도적으로 선언하지 않는다. 현재 운영 adapter는
# DB+불변 PDF 복구 세대 전체를 독립 서명 manifest에 결속하지 못하므로, 값을 미리
# 넣거나 배포 버튼만 누르는 것으로 재해 복구가 완료되지 않는다.
