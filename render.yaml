services:
  - type: web
    name: company-analysis-beta
    runtime: docker
    # 실제 DART 118,747사 후보 색인이 512MiB를 넘어 Starter에서 재시작됐다.
    # 실분석 운영에 필요한 최소 사양인 Standard(2GiB)를 사용한다.
    plan: standard
    region: singapore
    numInstances: 1
    dockerfilePath: ./app/Dockerfile
    dockerContext: .
    healthCheckPath: /readyz
    # 첫 관리자 베타는 비용과 외부 변경을 통제하도록 수동 배포만 허용한다.
    autoDeployTrigger: off

    # SQLite·보고서·감사 기록을 재배포와 재시작 뒤에도 보존한다.
    disk:
      name: company-analysis-data
      mountPath: /var/data
      sizeGB: 1

    envVars:
      # 실제 provider를 쓰되, 품질 검증이 끝날 때까지 관리자 한 명으로 범위를 고정한다.
      - key: PIPELINE
        value: real
      - key: BETA_ADMIN_ONLY
        value: "1"

      # 보고서 본문을 composer(엔진 v2)가 쓴다. 코드는 이 값이 정확히 "1"일
      # 때만 갈리므로(app/src/features/pipeline/real.py) 따옴표를 지운 1이나
      # true로 바꾸면 오류 없이 조용히 v1로 되돌아간다.
      # v2는 1층 캐시를 쓰지 않아 같은 회사를 두 번 조사하면 두 번 다 비용이 든다.
      - key: ENGINE_V2
        value: "1"

      # Render edge가 붙인 forwarded header는 전혀 신뢰하지 않는다. 앱은 고정된
      # 공개 HTTPS origin만 Host·CSRF·HSTS 판단에 사용한다.
      - key: DEPLOYMENT_EXPOSURE
        value: public
      - key: DEPLOYMENT_PLATFORM
        value: render
      - key: DEPLOYMENT_RUNTIME_CONTRACT
        value: render-admin-real-no-forwarded-v1
      - key: PUBLIC_ORIGIN
        fromService:
          type: web
          name: company-analysis-beta
          envVarKey: RENDER_EXTERNAL_URL
      - key: FORWARDED_ALLOW_IPS
        value: ""

      # 위 영속 디스크 안에 운영 데이터와 캐시를 모은다.
      - key: APP_DATA_ROOT
        value: /var/data
      - key: STORAGE_DB_PATH
        value: /var/data/storage.db
      - key: OBSERVABILITY_RECORDS_PATH
        value: /var/data/observability/runs.jsonl
      - key: TLDEXTRACT_CACHE
        value: /var/data/cache/tldextract

      # 비밀값은 저장소가 아니라 Blueprint 생성 화면에서 사용자가 직접 입력한다.
      - key: ADMIN_EMAILS
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false

      # 실제 분석 provider 값은 저장소에 넣지 않고 Render 비밀 환경변수로만 주입한다.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DART_API_KEY
        sync: false
      - key: NAVER_CLIENT_ID
        sync: false
      - key: NAVER_CLIENT_SECRET
        sync: false

      # 실행 기록을 재시작 뒤에도 검증할 수 있도록 Render가 고정 비밀을 만든다.
      - key: PROVENANCE_SEAL_SECRET
        generateValue: true
