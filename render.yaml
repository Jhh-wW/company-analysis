services:
  - type: web
    name: company-analysis-beta
    runtime: docker
    plan: starter
    region: singapore
    numInstances: 1
    dockerfilePath: ./app/Dockerfile
    dockerContext: .
    healthCheckPath: /readyz
    # 첫 관리자 베타는 비용과 외부 변경을 통제하도록 수동 배포만 허용한다.
    autoDeployTrigger: off

    disk:
      name: app-data
      mountPath: /var/data
      sizeGB: 1

    envVars:
      # 첫 배포는 관리자 한 명이 확인하는 무과금 API 데모로 범위를 고정한다.
      - key: PIPELINE
        value: demo
      - key: BETA_ADMIN_ONLY
        value: "1"

      # Render edge가 붙인 forwarded header는 전혀 신뢰하지 않는다. 앱은 고정된
      # 공개 HTTPS origin만 Host·CSRF·HSTS 판단에 사용한다.
      - key: DEPLOYMENT_EXPOSURE
        value: public
      - key: DEPLOYMENT_PLATFORM
        value: render
      - key: DEPLOYMENT_RUNTIME_CONTRACT
        value: render-admin-demo-no-forwarded-v1
      - key: PUBLIC_ORIGIN
        fromService:
          type: web
          name: company-analysis-beta
          envVarKey: RENDER_EXTERNAL_URL
      - key: FORWARDED_ALLOW_IPS
        value: ""

      # 재배포·재시작 뒤에도 남아야 하는 기록은 모두 한 영속 디스크에 둔다.
      - key: APP_DATA_ROOT
        value: /var/data
      - key: STORAGE_DB_PATH
        value: /var/data/storage.db
      - key: OBSERVABILITY_RECORDS_PATH
        value: /var/data/observability/runs.jsonl
      - key: TLDEXTRACT_CACHE
        value: /var/data/cache/tldextract

      # 비밀값은 저장소가 아니라 Blueprint 생성 화면에서 사용자가 직접 입력한다.
      - key: ADMIN_EMAILS
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false

      # demo 실행 기록도 재시작 뒤 검증할 수 있도록 Render가 고정 비밀을 만든다.
      - key: PROVENANCE_SEAL_SECRET
        generateValue: true
