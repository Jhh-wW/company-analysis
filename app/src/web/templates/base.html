<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}기업분석 도구{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="{% block bodyclass %}{% endblock %}">
  <a class="skip-link" href="#main-content">본문으로 건너뛰기</a>
  <header class="topbar">
    <a class="brand brand-mark brand-mark-compact" href="/" aria-label="기업 분석">기업 분석<span class="brand-mark-dot" aria-hidden="true"></span></a>
    {# 지금 무엇으로 돌고 있는지 정직하게 알린다. 진짜인데 「데모」라고 쓰면 거짓말이다. #}
    {% if evaluation_mode %}
      <span class="tag evaluation" title="로컬에서 외부 조사 성능과 비용을 제한해 시험합니다">실시간 성능시험</span>
    {% elif is_real %}
      <span class="tag real" title="실제 공시·IR·회사 공식 자료를 조사합니다">실제 조사</span>
    {% else %}
      <span class="tag">샘플 모드</span>
    {% endif %}
    <span class="spacer"></span>
    {% include "_auth_status.html" %}
  </header>

  <main id="main-content" class="wrap {% block wrapclass %}{% endblock %}" tabindex="-1">
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
