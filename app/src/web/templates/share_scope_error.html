{% block content %}

  <div class="warn-line" role="alert">
    <span aria-hidden="true">⚠️</span>
    <div>
      <h1 id="link-error-title" style="font-size:19px;margin-bottom:6px">LINK 사용 상태를 확인해 주세요</h1>

  <div class="btn-row">

  </div>
</section>
{% endblock %}
