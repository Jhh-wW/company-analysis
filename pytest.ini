[pytest]
markers =
    local_integration: 저장소에 넣지 않는 대용량·원본 로컬 자료가 필요한 명시적 통합 시험

# ★ 왜 이 줄이 있나 (2026-08-25 실측)
#   `app/data/backups` 는 이 PC에서 소유자 본인도 ACL을 못 읽는 상태다
#   (`icacls` 조차 「액세스가 거부되었습니다」 · WinError 5). pytest가 시험을
#   찾으러 그 폴더에 들어가려다 **수집 단계에서 통째로 죽는다** — 시험 한 개도
#   못 돌린다. 그래서 `--ignore=data/backups` 를 손으로 붙여야 했다.
#
#   문서에는 「지금은 pytest에서 그 폴더를 건너뛰고 있다」고 적혀 있었으나
#   **건너뛰는 설정이 어디에도 없었다**(conftest.py·pytest.ini 둘 다 확인).
#   실제로는 매번 손으로 플래그를 붙이고 있었던 것이다. 그 구멍을 여기서 막는다.
#
#   ★ 폴더 권한 자체는 «고치지 않았다». 되돌리기 어려운 관리자 권한 작업이고,
#     백업·복구 기능을 만질 때 사람이 직접 손봐야 한다.
#     `app/data/` 는 git에 추적되지 않으므로(.gitignore:127 `**/backups/`)
#     배포·CI에는 영향이 없다 — 이 PC에서만 나는 문제다.
#
#   ⚠️ `norecursedirs` 는 pytest 기본값을 «덮어쓴다». 그래서 기본 목록
#     (*.egg .* _darcs build CVS dist node_modules venv {arch}) 을 그대로 다시
#     적고 그 뒤에 backups 를 더한다. 기본값을 빼먹으면 .venv 안까지 뒤진다.
norecursedirs = *.egg .* _darcs build CVS dist node_modules venv {arch} backups
