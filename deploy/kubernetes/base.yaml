apiVersion: v1
kind: ConfigMap
metadata:
  name: company-analysis-config
data:
  PORT: "10000"
  PIPELINE: demo
  BETA_ADMIN_ONLY: "1"
  LOG_LEVEL: info
  FORWARDED_ALLOW_IPS: "127.0.0.1"
  APP_DATA_ROOT: /var/data
  STORAGE_DB_PATH: /var/data/storage.db
  OBSERVABILITY_RECORDS_PATH: /var/data/observability/runs.jsonl
  TLDEXTRACT_CACHE: /var/data/cache/tldextract
  XDG_CACHE_HOME: /var/data/cache
  TMPDIR: /tmp
  GRACEFUL_SHUTDOWN_SECONDS: "300"
  HEALTHCHECK_PATH: /readyz
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: company-analysis-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: company-analysis
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: company-analysis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: company-analysis
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 330
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: registry.example.invalid/company-analysis:replace-with-immutable-tag
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 10000
          envFrom:
            - configMapRef:
                name: company-analysis-config
            - secretRef:
                name: company-analysis-runtime
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /var/data
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: company-analysis-data
        - name: temporary
          emptyDir:
            sizeLimit: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: company-analysis
spec:
  selector:
    app.kubernetes.io/name: company-analysis
  ports:
    - name: http
      port: 80
      targetPort: http
