apiVersion: v1
kind: ConfigMap
metadata:
  name: company-analysis-config
data:
  PORT: "10000"
  PIPELINE: demo
  BETA_ADMIN_ONLY: "1"
  LOG_LEVEL: info
  DEPLOYMENT_EXPOSURE: public
  DEPLOYMENT_PLATFORM: kubernetes
  # 문서용 TEST-NET placeholder다. 실제 ingress의 좁은 CIDR로 두 값을 함께
  # 교체하고 canary/NetworkPolicy 증거 SHA-256을 채우기 전에는 시작이 차단된다.
  PUBLIC_ORIGIN: https://replace.invalid
  FORWARDED_ALLOW_IPS: "192.0.2.1/32"
  K8S_INGRESS_PROXY_CIDRS: "192.0.2.1/32"
  HTTPS_ORIGIN_CSRF_CANARY_EVIDENCE_SHA256: ""
  CLIENT_IP_CANARY_EVIDENCE_SHA256: ""
  K8S_NETWORK_POLICY_EVIDENCE_SHA256: ""
  APP_DATA_ROOT: /var/data
  STORAGE_DB_PATH: /var/data/storage.db
  OBSERVABILITY_RECORDS_PATH: /var/data/observability/runs.jsonl
  TLDEXTRACT_CACHE: /var/data/cache/tldextract
  XDG_CACHE_HOME: /var/data/cache
  TMPDIR: /tmp
  GRACEFUL_SHUTDOWN_SECONDS: "300"
  HEALTHCHECK_PATH: /readyz
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: company-analysis-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: company-analysis
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: company-analysis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: company-analysis
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 330
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: registry.example.invalid/company-analysis:replace-with-immutable-tag
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 10000
          envFrom:
            - configMapRef:
                name: company-analysis-config
            - secretRef:
                name: company-analysis-runtime
          # envFrom보다 직접 env가 우선한다. service link와 service-account token이
          # 모두 꺼져 marker가 없어도 entrypoint가 public Kubernetes web을 강제한다.
          env:
            - name: DEPLOYMENT_RUNTIME_CONTRACT
              value: kubernetes-public-web-v1
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /var/data
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: company-analysis-data
        - name: temporary
          emptyDir:
            sizeLimit: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: company-analysis
spec:
  selector:
    app.kubernetes.io/name: company-analysis
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: company-analysis-ingress-only
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: company-analysis
  policyTypes:
    - Ingress
  ingress:
    - from:
        # 안전하게 닫힌 문서용 placeholder. 실제 ingress proxy의 좁은 CIDR로
        # ConfigMap 두 값과 동시에 바꿔야 한다.
        - ipBlock:
            cidr: 192.0.2.1/32
      ports:
        - protocol: TCP
          port: 10000
